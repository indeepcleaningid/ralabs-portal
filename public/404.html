<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Halaman tidak ada. RaLabs</title>
    <link rel="icon" type="image/webp" href="/images/favicon-logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --kertas: #f8fafc;
        --tinta: #0c0c0c;
        --merah: #d70000;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: var(--kertas);
        color: var(--tinta);
        font-family: 'Comfortaa', ui-rounded, system-ui, sans-serif;
      }

      main {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
      }

      p {
        max-width: 34ch;
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.25rem);
        line-height: 1.4;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 2rem;
        padding: 0 1.25rem;
        background: var(--merah);
        color: var(--kertas);
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--merah);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Halaman ini tidak ada di portal.</p>
      <a href="/">Kembali ke portal</a>
    </main>
  </body>
</html>
